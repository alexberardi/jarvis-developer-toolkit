# Reusable CI for Jarvis packages (jarvis-cmd-*, jarvis-device-*).
#
# A package calls it from its own .github/workflows/ci.yml:
#
#   jobs:
#     ci:
#       uses: alexberardi/jarvis-developer-toolkit/.github/workflows/package-ci.yml@main
#
# It runs the same checks Pantry runs (`jdt test . --install-deps`: manifest,
# static analysis, import checks) and then the package's own `pytest tests`
# when a tests/ directory exists.
#
# `toolkit-ref` must name the same ref as the `@...` in the caller's `uses:`
# line (a workflow cannot see which ref it was called at), so the jdt that
# runs is the jdt of the workflow that was called. Callers on @main leave it
# at the default.
name: package-ci

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version for the package's tests.
        type: string
        default: "3.11"
      toolkit-ref:
        description: Ref of jarvis-developer-toolkit to install jdt from; match the caller's `uses:` ref.
        type: string
        default: main
      sdk-ref:
        description: Ref of jarvis-command-sdk to install (it is not on PyPI).
        type: string
        default: main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install jdt
        env:
          TOOLKIT_REF: ${{ inputs.toolkit-ref }}
          SDK_REF: ${{ inputs.sdk-ref }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jarvis-command-sdk @ git+https://github.com/alexberardi/jarvis-command-sdk@${SDK_REF}" \
            "jarvis-developer-toolkit @ git+https://github.com/alexberardi/jarvis-developer-toolkit@${TOOLKIT_REF}" \
            pytest

      - name: jdt test
        run: jdt test . --install-deps -v

      - name: pytest
        run: |
          if [ -d tests ]; then
            python -m pytest tests
          else
            echo "no tests/ directory; skipping pytest"
          fi
